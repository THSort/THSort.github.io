<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@700&family=Barlow:wght@400;600&display=swap" rel="stylesheet"/>
<style>
  :root { --bg: #0a0c10; --ink: #eef2f7; --muted: #8a94a6; --accent: #4c8dff; --accent-ink: #06101f; }
  * { box-sizing: border-box; margin: 0; }
  body { min-height: 100vh; min-height: 100dvh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--ink); font: 400 1.0625rem/1.55 'Barlow', system-ui, sans-serif; }
  main { width: min(100%, 34rem); }
  p.code { font: 700 clamp(5rem, 22vw, 9rem)/0.85 'Barlow Condensed', 'Arial Narrow', sans-serif; color: var(--accent); }
  h1 { margin-top: 1rem; font: 700 clamp(1.8rem, 6vw, 2.6rem)/1 'Barlow Condensed', 'Arial Narrow', sans-serif; text-transform: uppercase; }
  p.msg { margin-top: 0.8rem; color: var(--muted); }
  a { display: inline-flex; margin-top: 1.8rem; padding: 0.8rem 1.3rem; background: var(--accent); color: var(--accent-ink); font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>

<main>
